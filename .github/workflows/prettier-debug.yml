name: Prettier debug

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Show Prettier diff
        run: |
          npx prettier --write src/orchestrator-lifecycle.ts test/review-readiness.test.mjs
          git diff -- src/orchestrator-lifecycle.ts test/review-readiness.test.mjs
