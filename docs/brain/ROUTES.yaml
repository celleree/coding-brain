version: 1
entrypoint: AI_START_HERE.md
durable_memory_store: .brain/

principles:
  - Prefer canonical sources over copied summaries.
  - Load only the context needed for the current task.
  - Reverify dynamic Git and GitHub facts before acting.
  - Never create a second durable memory store.
  - Expand context when evidence requires it, not by default.

sources:
  architecture:
    path: docs/architecture.md
    authority: stable
  schema:
    path: docs/schema.md
    authority: stable
  temporal_semantics:
    path: docs/temporal-semantics.md
    authority: stable
  cli_reference:
    path: docs/cli-reference.md
    authority: stable
  api_reference:
    path: docs/api.md
    authority: stable
  integration_contract:
    path: integrations/README.md
    authority: stable
  codex_contract:
    path: integrations/codex/SKILL.md
    authority: stable
  codex_adapter:
    path: integrations/codex/README.md
    authority: stable
  codex_personal_defaults:
    path: .codex/global-AGENTS.md
    authority: reusable-default
  package_manifest:
    path: package.json
    authority: current
  public_api:
    path: src/index.ts
    authority: current
  core_types:
    path: src/types.ts
    authority: current
  orchestrator_lifecycle:
    path: src/orchestrator-lifecycle.ts
    authority: current
  orchestrator_rotation:
    path: src/orchestrator-rotation.ts
    authority: current
  orchestrator_checkpoint:
    path: src/orchestrator-checkpoint-api.ts
    authority: current
  orchestrator_runtime_health:
    path: src/orchestrator-runtime-health.ts
    authority: current
  release_checklist:
    path: docs/release-checklist.md
    authority: stable
  release_guide:
    path: docs/release-guide.md
    authority: stable

routes:
  continue_project:
    match:
      - continue
      - next task
      - take over
      - what should we do next
    load:
      - architecture
      - integration_contract
    live_checks:
      - current default-branch SHA
      - open PRs and issues relevant to the requested area
      - current branch or exact target ref when supplied
    then:
      - narrow to a more specific route after inspecting current work

  implement_feature:
    match:
      - implement
      - add feature
      - build
      - change behavior
    load:
      - architecture
      - core_types
      - public_api
    live_checks:
      - current base SHA
      - overlapping open PRs or branches
    then:
      - inspect only directly relevant source and tests
      - preserve existing contracts unless the task explicitly changes them

  repair_review_findings:
    match:
      - fix review
      - repair finding
      - address reviewer
    load:
      - architecture
    live_checks:
      - exact PR head SHA
      - review finding still applies to that head
      - base branch has not materially invalidated the repair
    then:
      - inspect the finding and directly connected code/tests
      - repair the full confirmed defect rather than only the quoted symptom

  exact_head_review:
    match:
      - review exact head
      - independent review
      - review PR
    load:
      - architecture
    live_checks:
      - PR open and unmerged
      - exact head SHA
      - exact base SHA
      - CI/check state when required
    then:
      - review acceptance criteria against the complete diff and connected behavior
      - do not edit during an independent read-only review

  ci_failure:
    match:
      - CI failed
      - build failed
      - test failed
      - runner failed
    load:
      - package_manifest
    live_checks:
      - exact failing run belongs to current head
      - distinguish executable code failure from runner or platform failure
    then:
      - start from logs and failed commands
      - expand into source only when the evidence requires it

  memory_or_context:
    match:
      - memory
      - context
      - routing
      - RepoBrain
      - agent instructions
    load:
      - architecture
      - schema
      - temporal_semantics
      - integration_contract
      - cli_reference
      - api_reference
    live_checks:
      - current behavior in source and tests when prose may be stale
    then:
      - keep .brain as the only durable knowledge store
      - prefer stronger enforcement over adding duplicate prose

  codex_workflow:
    match:
      - Codex
      - coding agent
      - model routing
      - parallel agent
    load:
      - codex_contract
      - codex_adapter
      - codex_personal_defaults
      - integration_contract
    live_checks:
      - task-specific repository rules
      - current Codex capability when version-sensitive
    then:
      - use the cheapest model and reasoning level likely to complete the bounded task correctly
      - use parallel writers only when ownership is isolated

  orchestrator_lifecycle:
    match:
      - orchestrator
      - rotation
      - epoch
      - handoff
      - controller transfer
    load:
      - architecture
      - orchestrator_lifecycle
      - orchestrator_rotation
      - orchestrator_checkpoint
      - orchestrator_runtime_health
    live_checks:
      - active Issue #4 phase and dependent PR state
      - no overlapping lifecycle implementation
    then:
      - preserve one lifecycle system
      - do not duplicate memory or execution-routing systems

  release:
    match:
      - release
      - publish
      - npm
      - package
    load:
      - package_manifest
      - release_checklist
      - release_guide
    live_checks:
      - current version and package contents
      - required verification state
    then:
      - follow the release checklist before publishing
