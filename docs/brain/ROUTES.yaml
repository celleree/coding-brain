version: 1
entrypoint: AI_START_HERE.md
durable_memory_store: .brain/

principles:
  - Prefer canonical sources over copied summaries.
  - Load only the context needed for the current task.
  - Reverify dynamic Git and GitHub facts before acting.
  - Never create a second durable memory store.
  - Expand context when evidence requires it, not by default.

sources:
  memory_index:
    path: .brain/shared/index.md
    authority: explicitly-shared-durable-memory
    optional: true
  readme:
    path: README.md
    authority: stable
  architecture:
    path: docs/architecture.md
    authority: stable
  schema:
    path: docs/schema.md
    authority: stable
  temporal_semantics:
    path: docs/temporal-semantics.md
    authority: stable
  cli_reference:
    path: docs/cli-reference.md
    authority: stable
  api_reference:
    path: docs/api.md
    authority: stable
  workflow_modes:
    path: docs/workflow-modes.md
    authority: stable
  team_workflow:
    path: docs/team-workflow.md
    authority: stable
  integration_contract:
    path: integrations/README.md
    authority: stable
  codex_contract:
    path: integrations/codex/SKILL.md
    authority: stable
  codex_adapter:
    path: integrations/codex/README.md
    authority: stable
  codex_install:
    path: .codex/INSTALL.md
    authority: stable
  codex_session_start:
    path: .codex/session-start-prompt.md
    authority: stable
  codex_personal_defaults:
    path: .codex/global-AGENTS.md
    authority: reusable-default
  package_manifest:
    path: package.json
    authority: current
  public_api:
    path: src/index.ts
    authority: current
  core_types:
    path: src/types.ts
    authority: current
  orchestrator_lifecycle:
    path: src/orchestrator-lifecycle.ts
    authority: current
  orchestrator_rotation:
    path: src/orchestrator-rotation.ts
    authority: current
  orchestrator_checkpoint:
    path: src/orchestrator-checkpoint-api.ts
    authority: current
  orchestrator_runtime_health:
    path: src/orchestrator-runtime-health.ts
    authority: current
  release_checklist:
    path: docs/release-checklist.md
    authority: stable
  release_guide:
    path: docs/release-guide.md
    authority: stable

routes:
  continue_project:
    priority: 10
    match:
      - continue
      - next task
      - take over
      - what should we do next
      - what should we build next
    load:
      - memory_index
      - architecture
      - integration_contract
    live_checks:
      - current default-branch SHA
      - open PRs and issues relevant to the requested area
      - current branch or exact target ref when supplied
    then:
      - narrow to a more specific route after inspecting current work

  implement_feature:
    priority: 40
    match:
      - implement feature
      - add feature
      - build feature
      - change behavior
      - implement
    load:
      - memory_index
      - architecture
      - core_types
      - public_api
    live_checks:
      - current base SHA
      - overlapping open PRs or branches
    then:
      - inspect only directly relevant source and tests
      - preserve existing contracts unless the task explicitly changes them

  repair_review_findings:
    priority: 95
    match:
      - fix review finding
      - repair review finding
      - repair finding
      - address reviewer
      - fix reviewer feedback
    load:
      - memory_index
      - architecture
    live_checks:
      - exact PR head SHA
      - review finding still applies to that head
      - base branch has not materially invalidated the repair
    then:
      - inspect the finding and directly connected code/tests
      - repair the full confirmed defect rather than only the quoted symptom

  exact_head_review:
    priority: 100
    match:
      - review exact head
      - independent review
      - review PR
      - exact head review
    load:
      - memory_index
      - architecture
    live_checks:
      - PR open and unmerged
      - exact head SHA
      - exact base SHA
      - CI/check state when required
    then:
      - review acceptance criteria against the complete diff and connected behavior
      - do not edit during an independent read-only review

  ci_failure:
    priority: 90
    match:
      - CI fail
      - CI failing
      - build fail
      - test fail
      - runner fail
      - why did CI fail
      - why did build fail
    load:
      - memory_index
      - package_manifest
    live_checks:
      - exact failing run belongs to current head
      - distinguish executable code failure from runner or platform failure
    then:
      - start from logs and failed commands
      - expand into source only when the evidence requires it

  setup_onboarding:
    priority: 85
    match:
      - setup RepoBrain
      - set up RepoBrain
      - initialize RepoBrain
      - onboarding
      - install RepoBrain
      - workflow preset
    load:
      - memory_index
      - readme
      - workflow_modes
      - cli_reference
      - integration_contract
    live_checks:
      - current package version when installation details matter
    then:
      - choose the lightest workflow preset that satisfies the repository's review requirements

  memory_review:
    priority: 85
    match:
      - review memories
      - review memory
      - approve memories
      - approve memory
      - candidate memory
      - promote candidates
      - memory candidates
    load:
      - memory_index
      - team_workflow
      - schema
      - cli_reference
    live_checks:
      - current candidate queue
    then:
      - preserve candidate-first review
      - do not promote ambiguous or low-signal memory automatically

  memory_maintenance:
    priority: 80
    match:
      - memory maintenance
      - audit memory
      - stale memory
      - clean memory
      - sweep memory
    load:
      - memory_index
      - schema
      - temporal_semantics
      - cli_reference
    live_checks:
      - current memory audit and schema health
    then:
      - prefer deterministic audit and lifecycle commands over manual file edits

  memory_or_context:
    priority: 20
    match:
      - memory
      - context
      - routing
      - RepoBrain
      - agent instructions
      - navigation
    load:
      - memory_index
      - architecture
      - schema
      - temporal_semantics
      - integration_contract
      - cli_reference
      - api_reference
    live_checks:
      - current behavior in source and tests when prose may be stale
    then:
      - keep .brain as the only durable knowledge store
      - prefer stronger enforcement over adding duplicate prose

  codex_workflow:
    priority: 70
    match:
      - Codex
      - coding agent
      - model routing
      - parallel agent
    load:
      - memory_index
      - codex_contract
      - codex_adapter
      - codex_install
      - codex_session_start
      - codex_personal_defaults
      - integration_contract
    live_checks:
      - task-specific repository rules
      - current Codex capability when version-sensitive
    then:
      - use the cheapest model and reasoning level likely to complete the bounded task correctly
      - use parallel writers only when ownership is isolated

  orchestrator_lifecycle:
    priority: 75
    match:
      - orchestrator
      - rotation
      - epoch
      - handoff
      - controller transfer
    load:
      - memory_index
      - architecture
      - orchestrator_lifecycle
      - orchestrator_rotation
      - orchestrator_checkpoint
      - orchestrator_runtime_health
    live_checks:
      - active Issue #4 phase and dependent PR state
      - no overlapping lifecycle implementation
    then:
      - preserve one lifecycle system
      - do not duplicate memory or execution-routing systems

  release:
    priority: 75
    match:
      - release
      - publish
      - npm
      - package
    load:
      - memory_index
      - package_manifest
      - release_checklist
      - release_guide
    live_checks:
      - current version and package contents
      - required verification state
    then:
      - follow the release checklist before publishing
