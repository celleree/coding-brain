name: C1 Full Verification

on:
  push:
    branches:
      - feature/orch-c1-runtime-health

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format C1 files
        run: |
          npx prettier --write src/orchestrator-runtime-health.ts test/orchestrator-runtime-health.test.mjs
          if ! git diff --quiet -- src/orchestrator-runtime-health.ts test/orchestrator-runtime-health.test.mjs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/orchestrator-runtime-health.ts test/orchestrator-runtime-health.test.mjs
            git commit -m "Format C1 runtime health"
            git push
          fi
      - name: Build test artifacts
        run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run smoke:package
